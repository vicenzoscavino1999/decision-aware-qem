name: Reproduce

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  canonical-linux-docker:
    name: Canonical linux/amd64 Docker reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build canonical image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -t daqem-repro:ci .

      - name: Run canonical reproduction
        run: |
          set -euo pipefail
          # Canonical reproduction path: no quantum cloud account, no hardware,
          # and no secrets are required. Everything runs inside Docker.
          docker run --rm --platform linux/amd64 daqem-repro:ci \
            python scripts/reproduce_all.py 2>&1 | tee reproduce_all.log
          grep -F "REPRODUCE_ALL_PASS" reproduce_all.log

      - name: pip-audit advisory
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip install pip-audit
          python -m pip_audit -r requirements-lock.linux.txt 2>&1 | tee pip_audit.log

      - name: Upload CI logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-results-canonical-linux-docker
          path: |
            reproduce_all.log
            pip_audit.log
          if-no-files-found: ignore

  cross-platform:
    name: Native ${{ matrix.os }} reproduction
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.4
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
          cache: pip
          cache-dependency-path: requirements-lock.linux.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock.linux.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run native reproduction
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reproduce_all.py 2>&1 | tee reproduce_all.log
          grep -F "REPRODUCE_ALL_PASS" reproduce_all.log

      - name: Upload native CI log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-results-native-${{ matrix.os }}
          path: reproduce_all.log
          if-no-files-found: ignore
