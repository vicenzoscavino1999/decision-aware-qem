name: Reproduce manuscript v45
"on":
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned environment
        run: docker build --platform linux/amd64 -t daqem:1.2.0 .
      - name: Tests, main analyses, supplements and manuscript checks
        run: |
          mkdir -p "$RUNNER_TEMP/reproduction"
          docker run --rm --network none --platform linux/amd64 \
            --mount "type=bind,source=$RUNNER_TEMP/reproduction,target=/reports" \
            daqem:1.2.0 --mode all --workers 2 --output /reports/run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-records
          path: |
            ${{ runner.temp }}/reproduction/run/execution.json
            ${{ runner.temp }}/reproduction/run/*.log
            ${{ runner.temp }}/reproduction/run/tests.xml
            ${{ runner.temp }}/reproduction/run/reference_comparison.json
            ${{ runner.temp }}/reproduction/run/numerical/
            ${{ runner.temp }}/reproduction/run/supplements.json
            ${{ runner.temp }}/reproduction/run/supplements/run_*/*.log
            ${{ runner.temp }}/reproduction/run/supplements/run_*/pec_verification.json
            ${{ runner.temp }}/reproduction/run/supplements/run_*/e1/verification.json
            ${{ runner.temp }}/reproduction/run/supplements/run_*/e1/close_score_verification.json
            ${{ runner.temp }}/reproduction/run/supplements/run_*/manuscript/*.json
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-lock.linux.txt
