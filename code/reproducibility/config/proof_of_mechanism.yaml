methods: [Raw, Accuracy-ZNE, Decision-ZNE, CDR, PEC]
budget_grid: [768, 1536, 3072, 6144]
replicates: 30
bootstrap_repetitions: 1000
ci_alpha: 0.05
matched_total_shot_budget: true
record_randomized_method_order: true
sampling_scope: stationary_multinomial_streams_not_physical_randomized_execution
decision_rule: strict_optimum_with_all_exact_ties_counted_as_failures
ci_scope: paired_stratified_replicate_bootstrap_conditional_on_fixed_instances

noise:
  family: depolarizing_known_channel
  p1: 0.01
  p2: 0.03
  zne_scales: [1.0, 2.0, 3.0]
  zne_order: 1

budget_policy:
  Raw:
    eval_shots: total_budget
  Accuracy-ZNE:
    per_scale_shots: total_budget / 3
  Decision-ZNE:
    per_scale_shots: total_budget / 3
  CDR:
    correction: global_positive_affine_control
    eval_shots: total_budget
    fit_information: exact_noisy_and_ideal_means_of_the_evaluated_candidate_set
    C_train_measured: false
    note: >
      CDR is used as the common-mode/affine negative control. The decision
      comparison uses the same Raw evaluation shots to isolate affine
      invariance. This oracle affine control is distinct from finite-shot CDR
      P0 training. No measured training-shot cost or end-to-end matched-cost
      CDR advantage is claimed for this control.
  PEC:
    effective_samples: floor(total_budget / gamma_squared)
    variance_proxy: ideal_multinomial_with_effective_samples
    note: >
      This is the finite-shot PEC cost-equivalent proxy: an unbiased ideal
      estimator with covariance Sigma_ideal / floor(B/gamma^2). Flooring makes
      the variance inflation B/floor(B/gamma^2), generally above gamma^2.
      Budgets yielding zero effective samples are rejected. This is not signed
      PEC circuit sampling.

death_criteria:
  margin_nondegenerate_min_epsilon: 0.0001
  pec_matched_budget_effect_required: true
  physical_execution_order_test: not_applicable_to_stationary_multinomial_sampling
  gap_kernel_explains_required: true
  affine_control_is_not_the_effect_required: true
  cdr_decision_flat_tolerance: 0.0
