# PAP §5.2 #7 | transcrito de experiments/a3_pullback_frontier.py,
# reproducibility/config/a3_pullback_frontier.yaml y
# results/pilot/a3_frozen_prediction/*.npz | firewall: no recalcular
freeze_status: pre_hash_consolidated
artifact_ids: [7]

sources:
  implementation: experiments/a3_pullback_frontier.py
  config: reproducibility/config/a3_pullback_frontier.yaml
  materialized_prediction_npz: results/pilot/a3_frozen_prediction/*.npz
  contrast_matrix_artifact: results/frozen/contrast_matrices.npz

formula:
  primitive_kernel: K_m = M_m C_dev M_m^T
  gap_kernel: Sigma_m = L K_m L^T
  composed_form: Sigma_m = (L M_m) C_dev (L M_m)^T
  code_equivalent: sigma_unit = (gap_map * cdev_true_diag_unit) @ gap_map.T; sigma_pred = nearest_psd(sigma_unit / budget)

contrast:
  L_source: src/daqem/gap_kernel.py::contrast_matrix
  candidate_count_n: 25
  ref: 0
  L_shape: [24, 25]
  relation_to_A3_gap_maps: >
    A3 materializes gap_maps as L*M_m with shape [method, gap, primitive].
    For the full pilot this is [3, 24, 75], where 75 = 3 noise scales * 25
    candidates.

channel:
  type: C_dev_true
  representation: cdev_true_diag_unit
  structure: diagonal_unit_primitive_variance
  parameter_count: 75
  scaling_by_budget: divide_per_unit_covariance_by_budget

materialized_npz_keys:
  - sigma_pred
  - gap_maps
  - gradients
  - active_masks
  - gradient_unstable
  - gradient_steps
  - method_coefficients
  - cdev_true_diag_unit
  - primitive_mean_unit
  - primitive_variance_unit
  - mu
  - method_names
  - pair_names
  - budgets
  - metadata_json

expected_shapes:
  gap_maps: [3, 24, 75]
  sigma_pred: [3, 6, 24, 24]
  gradients: [3, 6, 24, 24]
  method_coefficients: [3, 3]
  cdev_true_diag_unit: [75]
  mu: [24]

methods:
  method_names: [Raw, Accuracy-ZNE, Decision-ZNE]
  method_coefficients_source: results/pilot/a3_frozen_prediction/*.npz
  zne_lambdas: [1.0, 2.0, 3.0]

budgets: [256, 512, 1024, 2048, 4096, 8192]

projected_flip_gate:
  method_pairs:
    - [Raw, Accuracy-ZNE]
    - [Raw, Decision-ZNE]
    - [Accuracy-ZNE, Decision-ZNE]
  rho_flip: 0.50
  mde_absolute: 0.005
  epsilon0: 0.000000000001
  primary_rule: delta_rank_projected < rho_flip * abs(delta_pred_true)
  ambiguous_if:
    - abs(delta_pred_true) < mde_absolute
    - gradient_unstable_for_either_method

gradient:
  method: central_finite_differences_on_active_symmetric_Sigma_basis
  perturbation_relative: 0.0001
  perturbation_floor: 0.00000001
  gradient_stability_relative: 0.25
  gradient_stability_absolute: 0.00000001
  active_z_slack: 0.75
  min_active_gaps: 3
  max_active_gaps: 6

firewall:
  freeze_before_Sigma_hat: true
  no_recompute_in_this_batch: true
  npz_files_read_only: true
